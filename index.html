<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harinarayan Chauhan - Public Support</title>

<style>
body { font-family: Arial; margin: 0; background: #f4f4f4; }

/* NAV */
nav {
  background: #000;
  color: white;
  padding: 10px;
  text-align: center;
}
nav a { color: white; margin: 10px; text-decoration: none; }

/* HERO */
.hero {
  text-align: center;
  padding: 40px;
  background: #004aad;
  color: white;
}

.profile {
  width: 150px;
  border-radius: 50%;
}

/* SECTIONS */
section { padding: 30px; text-align: center; }

.card {
  background: white;
  margin: 10px;
  padding: 20px;
  display: inline-block;
  border-radius: 10px;
}

/* FORM */
form {
  background: white;
  padding: 20px;
  max-width: 400px;
  margin: auto;
  border-radius: 10px;
}

input, select {
  width: 100%;
  margin: 10px 0;
  padding: 10px;
}

button {
  background: #004aad;
  color: white;
  padding: 10px;
  border: none;
}

/* FLOAT */
.whatsapp {
  position: fixed;
  bottom: 20px;
  right: 20px;
}
.whatsapp img { width: 60px; }
</style>
</head>

<body>

<nav>
  <a href="#about">About</a>
  <a href="#services">Services</a>
  <a href="#join">Join</a>
</nav>

<div class="hero">
  <img src="https://via.placeholder.com/150" class="profile">
  <!-- Replace above image with real photo -->
  <h1>Shri Harinarayan Chauhan</h1>
  <p>जिला अध्यक्ष – आम आदमी पार्टी, देवरिया</p>
</div>

<section id="about">
  <h2>हमारे बारे में</h2>
  <p>यह मंच जनसमर्थन और सेवा के लिए समर्पित है।</p>
</section>

<section id="services">
  <h2>सेवाएँ</h2>
  <div class="card">जन शिकायत</div>
  <div class="card">सरकारी योजना सहायता</div>
  <div class="card">सामाजिक सेवा</div>
</section>

<section id="join">
  <h2>जुड़ें</h2>

  <form onsubmit="saveData(event)">
    <input type="text" id="name" placeholder="नाम" required>
    <input type="text" id="father" placeholder="पिता का नाम" required>
    <input type="text" id="aadhaar" placeholder="आधार नंबर" required>

    <select id="role">
      <option>सदस्य</option>
      <option>वालंटियर</option>
      <option>सोशल मीडिया</option>
    </select>

    <button type="submit">Submit</button>
  </form>
</section>

<!-- WHATSAPP -->
<div class="whatsapp">
  <a href="https://wa.me/919793150845">
    <img src="https://img.icons8.com/color/96/whatsapp.png">
  </a>
</div>

<!-- ✅ FIREBASE + SAVE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "XXXX",
  appId: "XXXX"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ✅ SAVE FUNCTION
window.saveData = function(e) {
  e.preventDefault();

  let name = name.value;
  let father = father.value;
  let aadhaar = aadhaar.value;
  let role = role.value;

  if (aadhaar.length !== 12) {
    alert("Invalid Aadhaar");
    return;
  }

  push(ref(db, "users/"), {
    name, father, aadhaar, role,
    date: new Date().toLocaleString()
  });

  let msg = `New Join:
${name} - ${role}`;

  window.open("https://wa.me/919793150845?text=" +
    encodeURIComponent(msg));

  alert("Saved ✅");
}
</script>

</body>
</html>
